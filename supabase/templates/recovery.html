<h2 style="font-family:system-ui,sans-serif">Reset your Splitmate password</h2>
<p style="font-family:system-ui,sans-serif">Tap the link below to choose a new password. The link expires in one hour and can be used once.</p>
<p style="font-family:system-ui,sans-serif"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p style="font-family:system-ui,sans-serif;color:#666">If you did not ask to reset your password, you can ignore this email. Your password has not changed.</p>

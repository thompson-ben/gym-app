<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=block" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Geist,sans-serif;color:#eaebed;
background:radial-gradient(900px 700px at 70% 72%,rgba(195,237,137,.16),transparent 65%),radial-gradient(700px 500px at 15% 80%,rgba(255,255,255,.05),transparent 70%),#131416}
.eyebrow{position:absolute;top:300px;left:90px;font-size:30px;font-weight:600;letter-spacing:.18em;color:#8a9095}
h1{position:absolute;top:350px;left:86px;right:80px;font-size:128px;line-height:.95;font-weight:800;letter-spacing:-.05em}
h1 .m{color:#6b7176}
h1 .l{color:#c3ed89}
.chip{position:absolute;font-size:26px;font-weight:700;letter-spacing:.14em;padding:10px 20px;border-radius:999px}
/* notes card */
#notes{position:absolute;left:105px;top:900px;width:470px;height:640px;border-radius:44px;background:#f6f5f0;transform:rotate(-5deg);box-shadow:0 40px 80px -20px rgba(0,0,0,.7);padding:46px 40px;color:#1c1c1e;font-family:-apple-system,"SF Pro Text",Geist,sans-serif}
#notes .hd{color:#d69e00;font-size:28px;font-weight:600;margin-bottom:26px}
#notes .t{font-weight:800;font-size:40px;margin-bottom:12px}
#notes .ln{font-size:31px;line-height:1.75;position:relative;color:#3a3a3c}
#notes .ln::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:4px;background:#e5483d;border-radius:2px}
/* phone */
#phone{position:absolute;left:480px;top:780px;width:520px;height:960px;border-radius:72px;background:#0b0c0d;border:3px solid #34383d;padding:16px;transform:rotate(4deg);box-shadow:0 50px 100px -20px #000,0 0 160px rgba(195,237,137,.28)}
#screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#131416}
#screen img{position:absolute;width:780px;left:-14px;top:-200px}
#ring{position:absolute;left:112px;top:468px;width:200px;height:290px;border:5px solid #c3ed89;border-radius:22px;box-shadow:0 0 30px rgba(195,237,137,.6)}
.wm{position:absolute;top:120px;left:90px;font-size:44px;font-weight:800;letter-spacing:-.04em}
.wm span{color:#c3ed89}
</style></head><body>
<div class="eyebrow">STILL LOGGING LIFTS IN NOTES?</div>
<h1>Your Notes app<br><span class="m">is not a</span><br><span class="l">training log.</span></h1>
<div id="notes"><div class="hd">‹ Notes</div><div class="t">Push day</div>
<div class="ln">bench 60x8? or 62.5</div><div class="ln">incline db 22s x10</div><div class="ln">shoulders – same?</div><div class="ln">triceps… forgot</div></div>
<div class="chip" style="left:130px;top:850px;background:#2a2d31;color:#c4c8cc;transform:rotate(-5deg)">BEFORE</div>
<div id="phone"><div id="screen"><img src="../../../public/landing/target-hit.png"><div id="ring"></div></div></div>
<div class="chip" style="left:770px;top:745px;background:#c3ed89;color:#131416;transform:rotate(4deg)">SETMODO</div>
<div class="wm">setmodo<span>.</span></div>
</body></html>
